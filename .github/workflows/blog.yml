name: Build and Deploy
# 监听 master 分支上的 push 事件
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    # 构建环境使用 ubuntu
    runs-on: ubuntu-latest
    steps:
      # 官方action, 将代码拉取到虚拟机
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      # 安装node.js
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.18.2"

      # 下载依赖、打包项目
      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Compress files
        shell: pwsh
        run: |
          Compress-Archive -Path ./public/* -DestinationPath ./deploy.zip

      - name: Upload via WinRM
        uses: azure/powershell@v1
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}       # 服务器 IP 或域名
          WIN_USER: ${{ secrets.WIN_USER }}       # 用户名（如 github-deploy）
          WIN_PASS: ${{ secrets.WIN_PASSWORD }}   # 密码
          TARGET_DIR: 'C:\www\myapp'              # 目标目录
        with:
          inlineScript: |
            $securePass = ConvertTo-SecureString $env:WIN_PASS -AsPlainText -Force
            $cred = New-Object System.Management.Automation.PSCredential ($env:WIN_USER, $securePass)
            
            # 创建远程会话
            $session = New-PSSession -ComputerName $env:WIN_HOST -Credential $cred -UseSSL -SessionOption (New-PSSessionOption -SkipCACheck)

            # 上传并解压文件
            Copy-Item -Path ./deploy.zip -Destination "$env:TARGET_DIR\" -ToSession $session
            Invoke-Command -Session $session -ScriptBlock {
              Expand-Archive -Path "$using:TARGET_DIR\deploy.zip" -DestinationPath $using:TARGET_DIR -Force
            }

            # 执行清理或重启命令（示例）
            Invoke-Command -Session $session -ScriptBlock {
              Remove-Item -Path "$using:TARGET_DIR\deploy.zip" -Force
              # iisreset /restart  # 如需重启 IIS
            }

            Remove-PSSession $session
